name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: random-clusters generate --seed 42 --output data/smoke.csv
      - run: random-clusters batch examples/experiments.csv --output data/batch

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ".[dev]" "numpy==1.26.0" "pandas==2.2.3"
      - run: python -m pytest

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,research]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python research/verify_artifacts.py research/results/pilot-v1
      - run: |
          for scenario in primary small dimensions eight; do
            python research/verify_artifacts.py research/results/validation-${scenario}-v1
          done
      - run: python paper/verify_evidence.py
      - run: python research/verify_extension.py
      - run: python paper/analyze_diagnostics.py --check
      - run: |
          for diagnostic in range starts; do
            python research/verify_artifacts.py research/results/sensitivity-${diagnostic}-v1
          done
